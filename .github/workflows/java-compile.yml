name: Java compile check

on:
  push:
    branches:
      - main
      - "eaglefine/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-game:
    name: Compile game sources
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Show Java version
        run: java --version

      - name: Compile game Java sources
        run: >-
          ./gradlew :game:compileJava
          --console=plain
          --no-daemon
          --max-workers=2
          -Dorg.gradle.parallel=false
          -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
